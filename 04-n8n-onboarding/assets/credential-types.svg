<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="API 키 방식과 OAuth 방식 비교">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="5" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,1 L5,9 Z" fill="#a39e98"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#31302e">n8n의 두 가지 연결 방식</text>
  <text x="490" y="70" text-anchor="middle" font-size="14" fill="#615d59">서비스가 어떤 방식을 쓰는지에 따라 n8n에서 만드는 자격증명(credential) 종류가 정해집니다</text>

  <!-- Divider -->
  <line x1="490" y1="100" x2="490" y2="430" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Left panel: API key -->
  <text x="255" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#31302e">API 키 방식</text>
  <text x="255" y="142" text-anchor="middle" font-size="12" fill="#a39e98">예: OpenWeatherMap · 공공데이터포털 · 다수 AI API</text>

  <rect x="65" y="158" width="380" height="56" rx="12" fill="#f6f5f4" stroke="#dddddd" stroke-width="1.5"/>
  <text x="255" y="183" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31302e">1. 서비스 대시보드에서 API 키 발급</text>
  <text x="255" y="202" text-anchor="middle" font-size="12" fill="#615d59">설정 &gt; API / Developer 메뉴</text>

  <rect x="65" y="248" width="380" height="56" rx="12" fill="#f6f5f4" stroke="#dddddd" stroke-width="1.5"/>
  <text x="255" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31302e">2. 키 문자열 복사</text>
  <text x="255" y="292" text-anchor="middle" font-size="12" fill="#615d59">비밀번호처럼 취급, 노출 주의</text>

  <rect x="65" y="338" width="380" height="56" rx="12" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <text x="255" y="363" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1D4ED8">3. n8n credential에 붙여넣기</text>
  <text x="255" y="382" text-anchor="middle" font-size="12" fill="#615d59">키 입력 후 저장</text>

  <line x1="255" y1="216" x2="255" y2="246" stroke="#a39e98" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="255" y1="306" x2="255" y2="336" stroke="#a39e98" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Right panel: OAuth -->
  <text x="725" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#1D4ED8">OAuth 방식</text>
  <text x="725" y="142" text-anchor="middle" font-size="12" fill="#a39e98">예: Microsoft · Google · Slack · Notion</text>

  <rect x="535" y="158" width="380" height="56" rx="12" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <text x="725" y="183" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1D4ED8">1. n8n에서 'Sign in with ...' 클릭</text>
  <text x="725" y="202" text-anchor="middle" font-size="12" fill="#615d59">키를 직접 다루지 않음</text>

  <rect x="535" y="248" width="380" height="56" rx="12" fill="#f6f5f4" stroke="#dddddd" stroke-width="1.5"/>
  <text x="725" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31302e">2. 서비스 로그인 · 권한 동의</text>
  <text x="725" y="292" text-anchor="middle" font-size="12" fill="#615d59">서비스 화면에서 동의</text>

  <rect x="535" y="338" width="380" height="56" rx="12" fill="#f6f5f4" stroke="#dddddd" stroke-width="1.5"/>
  <text x="725" y="363" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31302e">3. 토큰이 자동 저장됨</text>
  <text x="725" y="382" text-anchor="middle" font-size="12" fill="#615d59">offline_access 있으면 자동 갱신</text>

  <line x1="725" y1="216" x2="725" y2="246" stroke="#a39e98" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="725" y1="306" x2="725" y2="336" stroke="#a39e98" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Footnote -->
  <text x="490" y="455" text-anchor="middle" font-size="10.5" fill="#a39e98">기준일 2026-06-19 · 지지플랩</text>
</svg>
